<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720">
  <defs>
    <!-- corona: sale del borde de la luna (r=300 de 360 -> 0.8333) -->
    <radialGradient id="corona" cx="360" cy="360" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0.80" stop-color="#ff2448" stop-opacity="0"/>
      <stop offset="0.8333" stop-color="#ff2448" stop-opacity="0.62"/>
      <stop offset="0.855" stop-color="#ff2448" stop-opacity="0.26"/>
      <stop offset="0.90" stop-color="#ff2448" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ff2448" stop-opacity="0"/>
    </radialGradient>
    <!-- luz que se mete tantito a la luna -->
    <radialGradient id="borde" cx="360" cy="360" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0.86" stop-color="#ff2448" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2448" stop-opacity="0.20"/>
    </radialGradient>
    <linearGradient id="hilo" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f3"/>
      <stop offset="0.35" stop-color="#ff7a8e"/>
      <stop offset="1" stop-color="#ff2448"/>
    </linearGradient>
    <radialGradient id="perla" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffd6dd" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ff2448" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2448" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="360" cy="360" r="360" fill="url(#corona)"/>
  <circle cx="360" cy="360" r="300" fill="url(#borde)"/>
  <circle cx="360" cy="360" r="300" fill="none" stroke="#ff2448" stroke-opacity="0.28" stroke-width="5"/>
  <circle cx="360" cy="360" r="300" fill="none" stroke="url(#hilo)" stroke-width="1.5"/>
  <!-- la perla: el último punto de luz, arriba a la derecha (-32°) -->
  <circle cx="614.4" cy="201" r="26" fill="url(#perla)"/>
  <circle cx="614.4" cy="201" r="2.6" fill="#ffffff"/>
</svg>
