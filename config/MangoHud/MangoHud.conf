# Contador de FPS mínimo, estilo Steam: solo el número, arriba a la izquierda
legacy_layout=false
fps
fps_only
position=top-left
font_size=18
background_alpha=0
text_outline
offset_x=8
offset_y=8
# Tope de FPS un poco abajo de los 280 Hz del ASUS (G-Sync + V-Sync)
fps_limit=275
# Shift derecho + F12 lo oculta/muestra
toggle_hud=Shift_R+F12
