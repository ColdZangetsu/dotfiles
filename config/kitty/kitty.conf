background_opacity          0.6
cursor_trail                1
window_padding_width        25

include themes/noctalia.conf

# Ctrl+Z = deshacer dentro de Claude Code (manda Ctrl+_ en vez de suspender)
map --when-focus-on cmdline:claude ctrl+z send_text all \x1f

# ⏺ dibujado como Nero (kitty dibuja ● por su cuenta, no se puede mapear)
symbol_map U+23FA Nero Symbols
